[immoscout24_api]
# ImmobilienScout24 REST API Credentials
# Registrierung unter: https://api.immobilienscout24.de/
#
# 1. Erstelle ein Developer-Konto auf https://api.immobilienscout24.de/
# 2. Beantrage API-Zugang unter "Manage Access" (kann einige Tage dauern)
# 3. Trage deine Credentials hier ein
# 4. Benenne diese Datei um zu: config.ini
#
# Für die Such-API reicht Two-Legged OAuth (nur consumer_key + consumer_secret).
# Access Token wird nur für User-spezifische Daten benötigt (z.B. eigene Inserate).

consumer_key = DEIN_CONSUMER_KEY
consumer_secret = DEIN_CONSUMER_SECRET

# Optional: Nur nötig für Three-Legged OAuth (User-Daten)
# Kann leer gelassen werden für die Such-API
access_token = DEIN_ACCESS_TOKEN
access_token_secret = DEIN_ACCESS_TOKEN_SECRET

[suchparameter]
# Suchart: buy (kaufen) oder rent (mieten)
suchart = buy

# Immobilientyp: apartment (Wohnung), house (Haus)
immobilientyp = apartment

# Standort: Geocode-ID (hierarchisch aufgebaut)
# Format: 1276 (DE) + Region + Stadt + Bezirk
# Beispiele:
#   1276003001    = Berlin (gesamt)
#   1276003001046 = Berlin-Mitte
#   1276002004    = Hamburg (gesamt)
#   1276001019    = München (gesamt)
# Tipp: Geocode-IDs findest du in der IS24 URL wenn du auf der Webseite suchst
geocode = 1276003001

# Preisbereich (in Euro)
preis_min = 10000
preis_max = 100000

# Zimmerzahl
zimmer_min = 1
zimmer_max = 4

# Fläche (in m²)
flaeche_min = 25
flaeche_max = 120

# Maximale Anzahl Ergebnisse
max_ergebnisse = 50

[finanzierung]
# Finanzierungsparameter für DSCR-Berechnung
zinssatz = 0.038
tilgung = 0.01
nebenkosten_quote = 0.20
instandhaltung_qm = 10.0
mietausfall_quote = 0.02
min_dscr = 1.2

[api_settings]
# Produktions-URL oder Sandbox-URL
# Produktion: https://rest.immobilienscout24.de
# Sandbox:    https://rest.sandbox-immobilienscout24.de
base_url = https://rest.sandbox-immobilienscout24.de

# Ergebnisse pro Seite (max. 200)
page_size = 20

# Rate-Limit: max. 2000 Anfragen pro Minute
